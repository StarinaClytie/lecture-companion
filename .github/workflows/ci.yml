name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create macOS desktop app
        if: runner.os == 'macOS'
        run: npm run desktop:mac -- "$RUNNER_TEMP/Lecture Companion.app"
